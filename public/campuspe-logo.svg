<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#0080ff" />
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol: Graduation Cap + Forward Spark -->
